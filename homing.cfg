# Sensorless homing based on the Stock Klipper path in Voron's guide:
# https://docs.vorondesign.com/tuning/sensorless.html
# Adapted for Manta M8P v2, positive XY homing and Cartographer Z at 150,150.
# Machine adaptations: preserve known Z, clear provisional Z, restore modes,
# wait for StallGuard to clear, and prevent Z/full homing with untuned SGTHRS.

[force_move]
enable_force_move: True

[gcode_macro _HOME_X]
gcode:
    {% set run_x = printer.configfile.settings['tmc2209 stepper_x'].run_current|float %}
    {% set run_y = printer.configfile.settings['tmc2209 stepper_y'].run_current|float %}
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT=0.49
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT=0.49
    # X minimum is 5, so the guide's 15 mm kick must start at logical X20.
    SET_KINEMATIC_POSITION X=20 SET_HOMED=X
    G91
    G1 X-15 F2000
    M400
    G4 P2000
    G28 X
    G91
    G1 X-15 F2000
    M400
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={run_x}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={run_y}

[gcode_macro _HOME_Y]
gcode:
    {% set run_x = printer.configfile.settings['tmc2209 stepper_x'].run_current|float %}
    {% set run_y = printer.configfile.settings['tmc2209 stepper_y'].run_current|float %}
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT=0.49
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT=0.49
    SET_KINEMATIC_POSITION Y=15 SET_HOMED=Y
    G91
    G1 Y-15 F1500
    M400
    G4 P2000
    G28 Y
    G91
    G1 Y-15 F2000
    M400
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={run_x}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={run_y}

[homing_override]
axes: xyz
gcode:
    {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}
    {% set home_z = home_all or 'Z' in params %}
    {% set homed = printer.toolhead.homed_axes %}
    {% set home_x = home_all or 'X' in params or (home_z and 'x' not in homed) %}
    {% set home_y = home_all or 'Y' in params or (home_z and 'y' not in homed) %}
    {% set sg_x = printer.configfile.settings['tmc2209 stepper_x'].driver_sgthrs|int %}
    {% set sg_y = printer.configfile.settings['tmc2209 stepper_y'].driver_sgthrs|int %}
    {% if home_z and (sg_x == 255 or sg_y == 255) %}
        {action_raise_error("Sensorless homing needs calibration: tune individual G28 X / G28 Y, save both driver_SGTHRS values below 255, then restart before full/Z homing or printing.")}
    {% endif %}

    {% set absolute = printer.gcode_move.absolute_coordinates %}
    {% set feed = printer.gcode_move.speed %}
    # Lift relatively; a valid Z coordinate must never be replaced by Z=1.
    {% if 'z' in homed %}
        {% set hop = [3.0, [0.0, printer.toolhead.axis_maximum.z - printer.toolhead.position.z]|max]|min %}
        G91
        G1 Z{hop} F900
    {% else %}
        # Temporary reference solely for an upward clearance move.
        SET_KINEMATIC_POSITION Z=0 SET_HOMED=Z
        G91
        G1 Z3 F900
        M400
        SET_KINEMATIC_POSITION SET_HOMED= CLEAR_HOMED=Z
    {% endif %}
    {% if home_x %}
        _HOME_X
    {% endif %}
    {% if home_y %}
        _HOME_Y
    {% endif %}
    {% if home_z %}
        _HOME_Z_AT_CENTER
    {% endif %}
    G1 F{feed}
    G9{0 if absolute else 1}


[gcode_macro _HOME_Z_AT_CENTER]
description: Home Z at center and finish at Cartographer's mesh probing height
gcode:
    {% set th = printer.toolhead %}
    {% set pos = printer.gcode_move.gcode_position %}
    {% set post_home_z = printer.configfile.settings.scanner.trigger_distance|float %}
    G90
    G1 X{150 - th.position.x + pos.x} Y{150 - th.position.y + pos.y} F9000
    G28 Z
    _SAFE_LIFT MIN_Z={post_home_z} LIFT=0
