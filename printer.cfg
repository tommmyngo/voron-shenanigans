[include mainsail.cfg]
[include motors.cfg]
[include homing.cfg]
[include fans.cfg]
[include leds.cfg]
[include macros.cfg]
[include test_speed.cfg]
[include bedfans.cfg]

#####################################################################
#   UUID
#####################################################################
[mcu]
canbus_uuid: 083f05dfcad8

[mcu EBBCan]
canbus_uuid: 42b1d3fb028e #EBB36

[mcu scanner]
canbus_uuid: 4c963f0c12d1 

[virtual_sdcard]
path: /home/voron/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[scanner]
mcu: scanner            
x_offset: 0                          
y_offset: 23                         
backlash_comp: 0.00985
trigger_distance: 2.0
sensor: cartographer
sensor_alt: carto
mesh_runs: 1

[temperature_sensor Cartographer_MCU]
sensor_type: temperature_mcu
sensor_mcu: scanner
min_temp: 0
max_temp: 105


#####################################################################
#   Printer
#####################################################################

[printer]
kinematics: corexy
max_velocity: 650
max_accel: 10000
max_z_velocity: 30
max_z_accel: 150
square_corner_velocity: 10.0

[extruder]
step_pin: EBBCan:PD0
dir_pin: !EBBCan:PD1
enable_pin: !EBBCan:PD2
microsteps: 32
full_steps_per_rotation: 200
rotation_distance: 22.669
gear_ratio: 50:10
nozzle_diameter: 0.40
filament_diameter: 1.750
heater_pin: EBBCan:PB13
pressure_advance: 0.03
min_temp: 0
max_temp: 350
min_extrude_temp: 150
max_extrude_only_distance: 101.0
sensor_type: PT1000
sensor_pin: EBBCan:PA3
pullup_resistor: 4700

[filament_switch_sensor wwbmg_filament]
switch_pin: ^!EBBCan:PB6
pause_on_runout: True
event_delay: 3.0
debounce_delay: 0.1

[delayed_gcode disable_filament_sensor_on_startup]
initial_duration: 1
gcode:
	SET_FILAMENT_SENSOR SENSOR=wwbmg_filament ENABLE=0

[gcode_macro _CLIENT_VARIABLE]
variable_runout_sensor: "filament_switch_sensor wwbmg_filament"
variable_user_cancel_macro: "_CANCEL_CLEANUP"
gcode:

[tmc2209 extruder]
uart_pin: EBBCan:PA15
run_current: 0.65
interpolate: False
stealthchop_threshold: 0
sense_resistor: 0.110

# Restored Klipper TMC2209 defaults. Previous static Autotune values
# (TOFF=1, TBL=1, HSTRT=7, HEND=9) violated Trinamic HSTRT+HEND<=15
# for this low-inductance Moons CSE14, and correlated with GSTAT reset=1
# faults on the EBB36 extruder driver during heated prints.

[heater_bed]
heater_pin: PA1
sensor_type: Generic 3950
sensor_pin: PB1
max_power: 1.0
min_temp: 0
max_temp: 120


[quad_gantry_level]
gantry_corners:
	-60,-10
	360,370
points:
	50,25
	50,250
	250,250
	250,25
speed: 500
horizontal_move_z: 5
retries: 5
retry_tolerance: 0.0075
max_adjust: 10

[bed_mesh]
zero_reference_position: 150, 150
speed: 500
horizontal_move_z: 5
mesh_min: 50, 50
mesh_max: 250, 275
probe_count: 10, 10
algorithm: bicubic

[adxl345]
cs_pin: scanner:PA3
spi_bus: spi1
axes_map: x, -y, -z

[resonance_tester]
accel_chip: adxl345
probe_points:
   150, 150, 20

# Enable object exclusion
[exclude_object]

# Enable arcs support
[gcode_arcs]
resolution: 0.3

# Enable ShakeTune
[shaketune]
number_of_results_to_keep: 10
keep_raw_data: False
measurements_chunk_size: 2
timeout: 900

# Enable pause and resume print
[pause_resume]


[input_shaper]
#shaper_type_x: mzv
#shaper_freq_x: 71.2
#shaper_type_y: mzv
#shaper_freq_y: 50.6
damping_ratio_x: 0.060
damping_ratio_y: 0.053



[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PE7, EXP1_2=PG1,
    EXP1_3=PG0, EXP1_4=PF15,
    EXP1_5=PF14, EXP1_6=PF13,    # Slot in the socket on this side
    EXP1_7=PF12, EXP1_8=PF11,
    EXP1_9=<GND>, EXP1_10=<5V>,

    # EXP2 header
    EXP2_1=PE13, EXP2_2=PE12,
    EXP2_3=PE15, EXP2_4=PE11,
    EXP2_5=PE10, EXP2_6=PE14,      # Slot in the socket on this side
    EXP2_7=PE8, EXP2_8=<RST>,
    EXP2_9=<GND>, EXP2_10=<NC>

[temperature_sensor CB1]
sensor_type: temperature_host

[temperature_sensor MCU]
sensor_type: temperature_mcu

[temperature_sensor chamber]
sensor_type:  Generic 3950
sensor_pin:   PB0

[delayed_gcode filter_off]
gcode:
    SET_PIN PIN=nevermore VALUE=0

