[main]
theme: horizon

[printer Printer]
# Extruder and bed are always shown. Restrict extra title-bar temperatures to
# the same useful sensors shown in Mainsail.
titlebar_items: Cartographer_MCU, chamber
titlebar_name_type: full
# Keep host/controller diagnostics out of the Screen temperature UI.
hidden_sensors: CB1, MCU, cartographer_coil
# KlipperScreen supports four choices; 100 mm matches the maximum manual
# extrusion option used in Mainsail and remains below Klipper's 101 mm limit.
extrude_distances: 5, 10, 25, 100

