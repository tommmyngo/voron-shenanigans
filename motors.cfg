# Voron-style TMC2209 baseline, adapted to this Manta M8P v2 wiring.
# Static Autotune chopper values are labeled in each TMC driver section.
# SpreadCycle, motor current and sensorless homing settings are preserved.

#####################################################################
# 	X/Y Stepper Settings
#####################################################################

## X Stepper on Motor1(B Motor rear left)
[stepper_x]
step_pin: PE6
dir_pin: PE5
enable_pin: !PC14
microsteps: 64
full_steps_per_rotation: 200
rotation_distance: 40
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_min: 5
position_endstop: 302
position_max: 302
homing_speed: 80
homing_retract_dist: 0
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PC13
interpolate: False
run_current: 1.0
sense_resistor: 0.110
stealthchop_threshold: 0

# Static TMC Autotune chopper settings - moons-ms17hd6p420i.
# Copied from saved Autotune register writes; no plugin required.
driver_TOFF: 1
driver_TBL: 1
driver_HSTRT: 3
driver_HEND: 3
diag_pin: ^PF4
driver_SGTHRS: 120

## Y Stepper on Motor2 (A Motor rear right)
[stepper_y]
step_pin: PE2
dir_pin: PE1
enable_pin: !PE4
microsteps: 64
full_steps_per_rotation: 200
rotation_distance: 40
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_min: 0
position_endstop: 305
position_max: 305
homing_speed: 80
homing_retract_dist: 0
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: PE3
interpolate: False
run_current: 1.0
sense_resistor: 0.110
stealthchop_threshold: 0

# Static TMC Autotune chopper settings - moons-ms17hd6p420i.
# Copied from saved Autotune register writes; no plugin required.
driver_TOFF: 1
driver_TBL: 1
driver_HSTRT: 3
driver_HEND: 3
diag_pin: ^PF3
driver_SGTHRS: 120

