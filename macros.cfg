#####################################################################
#   Macros
#####################################################################

[gcode_macro PREHEAT]
description: Start heating the bed to 70C and hotend to 160C
gcode:
    M140 S70
    M104 S160


[gcode_macro RESET_SPEEDS]
description: Restore configured motion limits and feed/flow multipliers
gcode:
    M220 S100
    M221 S100
    SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity} ACCEL={printer.configfile.settings.printer.max_accel} SQUARE_CORNER_VELOCITY={printer.configfile.settings.printer.square_corner_velocity} MINIMUM_CRUISE_RATIO={printer.configfile.settings.printer.minimum_cruise_ratio}


[gcode_macro M109]
description: Wait for the hotend to enter Ellis's target-to-target-plus-1C window
rename_existing: M99109
gcode:
    {% set target = params.S|default(0)|float %}
    M104 {rawparams}
    {% if target != 0 %}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={target} MAXIMUM={target + 1}
    {% endif %}


[gcode_macro M141]
description: Record a requested chamber temperature for OrcaSlicer compatibility
variable_target: 0
gcode:
    {% set target = params.S|default(0)|float %}
    SET_GCODE_VARIABLE MACRO=M141 VARIABLE=target VALUE={target}
    RESPOND TYPE=echo MSG="Chamber heater unavailable; requested chamber target: {target}C"

[gcode_macro M191]
description: Defer OrcaSlicer chamber waiting to PRINT_START
gcode:
    {% set target = params.S|default(printer['gcode_macro M141'].target)|float %}
    SET_GCODE_VARIABLE MACRO=M141 VARIABLE=target VALUE={target}
    RESPOND TYPE=echo MSG="Chamber target {target}C deferred to PRINT_START"


[gcode_macro _CG28]
description: Home missing axes through the configured homing override
gcode:
    {% if printer.toolhead.homed_axes != 'xyz' %}
        G28
    {% endif %}


# Physical-coordinate helpers are evaluated AFTER any preceding home.
[gcode_macro _SAFE_LIFT]
description: Lift without descending; MIN_Z is a physical nozzle height
gcode:
    {% if 'z' not in printer.toolhead.homed_axes %}
        {action_raise_error("A real Z home is required before a clearance lift.")}
    {% endif %}
    {% set th = printer.toolhead %}
    {% set min_z = params.MIN_Z|default(5)|float %}
    {% set lift = params.LIFT|default(3)|float %}
    {% if lift < 0 or min_z > th.axis_maximum.z %}
        {action_raise_error("Clearance lift exceeds configured Z travel.")}
    {% endif %}
    {% set dz = [[lift, min_z - th.position.z, 0]|max, [th.axis_maximum.z - th.position.z, 0]|max]|min %}
    SAVE_GCODE_STATE NAME=STATE_SAFE_LIFT
    G91
    G1 Z{dz} F600
    RESTORE_GCODE_STATE NAME=STATE_SAFE_LIFT MOVE=0

[gcode_macro _TRAVEL_SAFE]
description: Lift first, then travel to physical XY coordinates
gcode:
    {% set th = printer.toolhead %}
    {% set pos = printer.gcode_move.gcode_position %}
    {% set x = params.X|default(th.position.x)|float %}
    {% set y = params.Y|default(th.position.y)|float %}
    {% if th.homed_axes != 'xyz' %}
        {action_raise_error("Home XYZ before travelling.")}
    {% endif %}
    {% if x < th.axis_minimum.x or x > th.axis_maximum.x or y < th.axis_minimum.y or y > th.axis_maximum.y %}
        {action_raise_error("Travel target is outside configured XY limits.")}
    {% endif %}
    SAVE_GCODE_STATE NAME=STATE_TRAVEL_SAFE
    _SAFE_LIFT MIN_Z={params.MIN_Z|default(5)} LIFT={params.LIFT|default(3)}
    G90
    G1 X{x - th.position.x + pos.x} Y{y - th.position.y + pos.y} F6000
    RESTORE_GCODE_STATE NAME=STATE_TRAVEL_SAFE MOVE=0

[gcode_macro QUAD_GANTRY_LEVEL]
description: Clear mesh and approach QGL height at a controlled Z speed
rename_existing: _QUAD_GANTRY_LEVEL
gcode:
    {% if printer.toolhead.homed_axes != 'xyz' %}
        {action_raise_error("Home XYZ before QGL.")}
    {% endif %}
    BED_MESH_CLEAR
    _QGL_AT_CLEARANCE {rawparams}

[gcode_macro _QGL_AT_CLEARANCE]
gcode:
    # Evaluate coordinates only AFTER BED_MESH_CLEAR has reset the transform.
    {% set z = printer.configfile.settings.quad_gantry_level.horizontal_move_z %}
    {% set pos = printer.gcode_move.gcode_position %}
    SAVE_GCODE_STATE NAME=STATE_QGL
    G90
    # Intentional vertical descent for probing, separate from XY travel.
    G1 Z{z - printer.toolhead.position.z + pos.z} F600
    M400
    _QUAD_GANTRY_LEVEL {rawparams}
    RESTORE_GCODE_STATE NAME=STATE_QGL MOVE=0

[gcode_macro DISABLE_STEPPERS]
gcode:  
    M84

[gcode_macro RETRACT]
description: Unload 100 mm at the rear bucket, preserving G-code modes
gcode:
    {% if not printer.extruder.can_extrude %}
        {action_raise_error("Heat the nozzle before retract.")}
    {% endif %}
    _CG28
    _TRAVEL_SAFE X=295 Y=303 MIN_Z=10
    {% set sensor_enabled = printer['filament_switch_sensor wwbmg_filament'].enabled %}
    SAVE_GCODE_STATE NAME=STATE_RETRACT
    SET_FILAMENT_SENSOR SENSOR=wwbmg_filament ENABLE=0
    M83
    G1 E-100 F300
    M400
    SET_FILAMENT_SENSOR SENSOR=wwbmg_filament ENABLE={1 if sensor_enabled else 0}
    RESTORE_GCODE_STATE NAME=STATE_RETRACT MOVE=0


[gcode_macro PURGE]
description: Purge 100 mm at the rear bucket, preserving G-code modes
gcode:
    {% if not printer.extruder.can_extrude %}
        {action_raise_error("Heat the nozzle before purge.")}
    {% endif %}
    _CG28
    _TRAVEL_SAFE X=295 Y=303 MIN_Z=10
    SAVE_GCODE_STATE NAME=STATE_PURGE
    M83
    G1 E100 F300
    RESTORE_GCODE_STATE NAME=STATE_PURGE MOVE=0


[gcode_macro PARK]
description: Home if needed, lift, then park without descending
gcode:
    _CG28
    _TRAVEL_SAFE X={(printer.toolhead.axis_minimum.x + printer.toolhead.axis_maximum.x) / 2} Y={printer.toolhead.axis_maximum.y - 5} MIN_Z=5 LIFT=10


[gcode_macro BELT_CHECK]
description: Lift to at least Z180 before travelling to the belt check point
gcode:
    _CG28
    _TRAVEL_SAFE X=150 Y=120 MIN_Z=180


[gcode_macro PREP_RESONANCE_TEST]
description: Silence fans and approach the resonance point with Z clearance
gcode:
    M400
    M107
    SET_FAN_SPEED FAN=BedFans SPEED=0
    SET_PIN PIN=nevermore VALUE=0
    SET_PIN PIN=exhaust_fan VALUE=0
    _CG28
    _TRAVEL_SAFE X=150 Y=150 MIN_Z=20
    RESPOND TYPE=command MSG="Resonance prep complete. Confirm clearance, then run SHAPER_CALIBRATE."

[gcode_macro OFF]
gcode:
    M84                                  ; turn steppers off
    TURN_OFF_HEATERS                     ; turn bed / hotend off
    M107                                 ; turn print cooling fan off
    SET_PIN PIN=exhaust_fan VALUE=0      ; turn exhaust off
    SET_PIN PIN=chamberlight VALUE=0     ; turn chamber light off
    SET_PIN PIN=nevermore VALUE=0        ; turn nevermore off
    
#####################################################################
#   A better print_start macro for v2/trident
#####################################################################

[gcode_macro PRINT_START]
gcode:
    {% set target_bed = params.BED|float %}
    {% set target_extruder = params.EXTRUDER|float %}
    {% set target_chamber = params.CHAMBER|default(printer['gcode_macro M141'].target)|float %}
    # Match Cartographer's mesh probing height for all linked start-path handoffs.
    {% set transition_z = printer.configfile.settings.scanner.trigger_distance|float %}
    {% if target_bed < 0 or target_bed > printer.configfile.settings.heater_bed.max_temp or target_extruder < printer.configfile.settings.extruder.min_extrude_temp or target_extruder > printer.configfile.settings.extruder.max_temp or target_chamber < 0 %}
        {action_raise_error("PRINT_START temperatures are outside configured limits.")}
    {% endif %}
    # Reject an untuned start before any heater, coordinate or motion command.
    {% if printer.configfile.settings['tmc2209 stepper_x'].driver_sgthrs == 255 or printer.configfile.settings['tmc2209 stepper_y'].driver_sgthrs == 255 %}
        {action_raise_error("Calibrate and save X/Y sensorless thresholds before printing.")}
    {% endif %}
    RESET_SPEEDS
    # Start heating immediately; do not block homing, leveling, meshing or touch.
    # 150C stays within Cartographer touch's maximum-temperature requirement.
    SET_DISPLAY_TEXT MSG="Preheating bed and nozzle"
    STATUS_HEATING
    M140 S{target_bed}
    M104 S152
    SET_PAUSE_NEXT_LAYER ENABLE=0
    SET_PAUSE_AT_LAYER ENABLE=0 LAYER=0
    UPDATE_DELAYED_GCODE ID=filter_off DURATION=0
    SET_GCODE_OFFSET Z=0 MOVE=0
    M107
    SET_PIN PIN=nevermore VALUE=0
    BED_MESH_CLEAR
    STATUS_HOMING
    # Reuse real XYZ homing while motors remain enabled; home when needed.
    _CG28
    G90
    M83
    {% if target_bed > 90 %}
        SET_PIN PIN=nevermore VALUE=1
        M106 S255
        _TRAVEL_SAFE X=150 Y=150 MIN_Z=15
        {% if target_chamber > 0 %}
            SET_DISPLAY_TEXT MSG="Heatsoak"
			BEDFANSFAST
            TEMPERATURE_WAIT SENSOR="temperature_sensor chamber" MINIMUM={target_chamber}
        {% endif %}
    {% endif %}
    M107
    SET_DISPLAY_TEXT MSG="Leveling Gantry"
    STATUS_LEVELING
    QUAD_GANTRY_LEVEL
    M400
    G4 P500
    G28 Z
    M400
    G4 P500
    SET_DISPLAY_TEXT MSG="Adaptive Mesh"
    STATUS_MESHING
    BED_MESH_CALIBRATE ADAPTIVE=1
    M400
    G4 P500
    # The mesh completes at probing height; normalize before rear travel.
    _SAFE_LIFT MIN_Z={transition_z} LIFT=0
    SET_DISPLAY_TEXT MSG="Cleaning Nozzle"
    STATUS_CLEANING
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM=150
    # Keep the print-start wipe at the common mesh-height handoff.
    CLEAN_NOZZLE TRAVEL_Z={transition_z}
    _TRAVEL_SAFE X=150 Y=150 MIN_Z={transition_z} LIFT=0
    M400
    G4 P500
    SET_DISPLAY_TEXT MSG="Cartographer Touch"
    # The installed original scanner plugin calls for touch AFTER meshing.
    # Slightly looser tolerance reduces retry churn on a loaded CB1 host.
    CARTOGRAPHER_TOUCH TOLERANCE=0.05
    M400
    G4 P500
    _SAFE_LIFT MIN_Z={transition_z} LIFT=0
    SET_DISPLAY_TEXT MSG="Heating Nozzle: {target_extruder}c"
    STATUS_HEATING
    # Reach the prime-line XY position with clearance before lowering.
    _TRAVEL_SAFE X=100 Y=0 MIN_Z={transition_z} LIFT=0
    G90
    G1 Z0.4 F600
    M400
    # Finish bed and nozzle heating only at the prime-line position.
    M104 S{target_extruder}
    M190 S{target_bed}
    M109 S{target_extruder}
    G4 P2000
    # Descend vertically only after arriving at the prime-line XY position.
    G90
    G1 Z0.25 F600
    M83
    G92 E0
    STATUS_PRINTING
    G1 X200 Y0 E20 F1500
    G92 E0
    G1 Z2 F600


[gcode_macro PRINT_END]
gcode:
    M400
    # Temperature-checked relative retract; avoid unloading 10 mm at job end.
    _CLIENT_RETRACT LENGTH=2 SPEED=30
    TURN_OFF_HEATERS
    {% if printer.toolhead.homed_axes == 'xyz' %}
        PARK
    {% endif %}
    M107
    BED_MESH_CLEAR
    RESET_SPEEDS
    SET_PAUSE_NEXT_LAYER ENABLE=0
    SET_PAUSE_AT_LAYER ENABLE=0 LAYER=0
    UPDATE_DELAYED_GCODE ID=filter_off DURATION=300
    STATUS_READY


[gcode_macro CLEAN_NOZZLE]
description: Lift before rear travel; lower only over the configured brush
variable_wipe_x_start: 170
variable_wipe_x_end: 205
variable_wipe_y: 302
variable_wipe_z: 0.5
variable_wipe_cycles: 4
variable_wipe_speed: 250
variable_safe_z: 5
gcode:
    _CG28
    _CLEAN_NOZZLE_AT_POSITION {rawparams}

[gcode_macro _CLEAN_NOZZLE_AT_POSITION]
gcode:
    {% set brush = printer['gcode_macro CLEAN_NOZZLE'] %}
    {% set th = printer.toolhead %}
    {% set pos = printer.gcode_move.gcode_position %}
    {% set requested_z = params.TRAVEL_Z|default(0)|float %}
    {% if requested_z > 0 %}
        # Print-start's requested handoff height never descends before rear travel.
        {% set travel_z = [[th.position.z, requested_z]|max, th.axis_maximum.z]|min %}
    {% else %}
        # Standalone cleaning retains its existing lift-before-rear-travel behavior.
        {% set travel_z = [[th.position.z + 3, brush.safe_z]|max, th.axis_maximum.z]|min %}
    {% endif %}
    {% if requested_z < 0 or (requested_z > 0 and requested_z <= brush.wipe_z) or requested_z > th.axis_maximum.z or brush.safe_z <= brush.wipe_z or brush.wipe_z < th.axis_minimum.z or brush.safe_z > th.axis_maximum.z or brush.wipe_x_start < th.axis_minimum.x or brush.wipe_x_start > th.axis_maximum.x or brush.wipe_x_end < th.axis_minimum.x or brush.wipe_x_end > th.axis_maximum.x or brush.wipe_y < th.axis_minimum.y or brush.wipe_y > th.axis_maximum.y or brush.wipe_cycles|int < 1 or brush.wipe_speed <= 0 %}
        {action_raise_error("Brush settings are outside configured travel or clearance limits.")}
    {% endif %}
    SAVE_GCODE_STATE NAME=STATE_CLEAN_NOZZLE
    _TRAVEL_SAFE X={brush.wipe_x_start} Y={brush.wipe_y} MIN_Z={travel_z} LIFT=0
    G90
    G1 Z{brush.wipe_z - th.position.z + pos.z} F600
    {% for cycle in range(brush.wipe_cycles|int) %}
        G1 X{brush.wipe_x_end - th.position.x + pos.x} F{brush.wipe_speed * 60}
        G1 X{brush.wipe_x_start - th.position.x + pos.x} F{brush.wipe_speed * 60}
    {% endfor %}
    _SAFE_LIFT MIN_Z={travel_z} LIFT=0
    M400
    RESTORE_GCODE_STATE NAME=STATE_CLEAN_NOZZLE MOVE=0


[gcode_macro DUMP_VARIABLES]
description: List Klipper variables; optional NAME, VALUE, and SHOW_CFG=1 filters
gcode:
    {% set filter_name = params.NAME|default('')|string|lower %}
    {% set filter_value = params.VALUE|default('')|string|lower %}
    {% set show_cfg = params.SHOW_CFG|default(0)|int %}
    {% set out = [] %}
    {% for key1 in printer %}
        {% for key2 in printer[key1] %}
            {% if (show_cfg or not (key1|lower == 'configfile' and key2|lower in ['config', 'settings'])) and (filter_name in key1|lower or filter_name in key2|lower) and filter_value in printer[key1][key2]|string|lower %}
                {% set dummy = out.append("printer['%s'].%s = %s" % (key1, key2, printer[key1][key2])) %}
            {% endif %}
        {% else %}
            {% if filter_name in key1|lower and filter_value in printer[key1]|string|lower %}
                {% set dummy = out.append("printer['%s'] = %s" % (key1, printer[key1])) %}
            {% endif %}
        {% endfor %}
    {% endfor %}
    {action_respond_info(out|join("\n"))}


[gcode_macro PARKFRONT]
description: Home if needed, lift, then park without descending
gcode:
    _CG28
    _TRAVEL_SAFE X={(printer.toolhead.axis_minimum.x + printer.toolhead.axis_maximum.x) / 2} Y={printer.toolhead.axis_minimum.y + 5} MIN_Z=5 LIFT=10


[gcode_macro PARKBED]
description: Home if needed, lift, then park without descending
gcode:
    _CG28
    _TRAVEL_SAFE X={(printer.toolhead.axis_minimum.x + printer.toolhead.axis_maximum.x) / 2} Y={(printer.toolhead.axis_minimum.y + printer.toolhead.axis_maximum.y) / 2} MIN_Z=15 LIFT=10



[gcode_macro _CANCEL_CLEANUP]
description: Mainsail cancel hook; reset mesh, limits and filter timer without motion
gcode:
    BED_MESH_CLEAR
    RESET_SPEEDS
    UPDATE_DELAYED_GCODE ID=filter_off DURATION=300
    STATUS_READY
