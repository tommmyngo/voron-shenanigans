#####################################################################
#   Macros
#####################################################################

[gcode_macro RESET_SPEEDS]
gcode:
    M220 S100               # Reset feedrate override to 100%
    M221 S100               # Reset flowrate override to 100%
    SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity} 
    SET_VELOCITY_LIMIT ACCEL={printer.configfile.settings.printer.max_accel}
    SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={printer.configfile.settings.printer.square_corner_velocity}
    {% if printer.toolhead.homed_axes == "xyz" %}
        G90                 # Set to absolute positioning
        G0 F18000           # Reset travel speed to 300mm/s
    {% endif %}
    SET_DISPLAY_TEXT MSG="Speeds Reset"


[gcode_macro _CG28]
gcode:
  RESET_SPEEDS
  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}    


[gcode_macro _CQGL]
gcode:
  RESET_SPEEDS
  {% if printer.quad_gantry_level.applied == False %}
      _CG28
      QUAD_GANTRY_LEVEL
      G28 Z
  {% endif %}

[gcode_macro DISABLE_STEPPERS]
gcode:  
    M84

[gcode_macro RETRACT]
gcode:  
    _CG28                   # Home if needed
    G90                     # Ensure absolute toolhead positioning
    G1 X295 Y303 Z10 F3000  # Move to purge bucket/position
    M83                     # Set extruder to RELATIVE mode
    G1 E-100 F300           # Retract 100mm of filament
    G92 E0

[gcode_macro PURGE]
gcode:  
    _CG28                   # Home if needed
    G90                     # Ensure absolute toolhead positioning
    G1 X295 Y303 Z10 F3000  # Move to purge bucket/position
    M83                     # Set extruder to RELATIVE mode
    G1 E100 F300            # Purge 80mm of filament
    G92 E0                  # Reset extruder position

[gcode_macro PARK]
gcode:
    _CG28
    G90
    G0 Z50
    G0 X150 Y300

[gcode_macro BELT_CHECK]
gcode:
    _CG28 
    G90
    G0 Z50
    G0 X150 Y120 Z180

[gcode_macro PREP_RESONANCE_TEST]
description: Home, silence fans, and park at the configured resonance test point.
gcode:
    M400
    M107
    SET_FAN_SPEED FAN=BedFans SPEED=0
    SET_PIN PIN=nevermore VALUE=0
    SET_PIN PIN=exhaust_fan VALUE=0
    _CG28
    G90
    G0 X150 Y150 Z20 F9000
    RESPOND TYPE=command MSG="Resonance prep complete. Confirm clearance, then run SHAPER_CALIBRATE."


[gcode_macro G32]
gcode:
   SAVE_GCODE_STATE NAME=STATE_G32
   G90
   _CQGL
   PARK
   RESTORE_GCODE_STATE NAME=STATE_G32

[gcode_macro OFF]
gcode:
    M84                                  ; turn steppers off
    TURN_OFF_HEATERS                     ; turn bed / hotend off
    M107                                 ; turn print cooling fan off
    SET_PIN PIN=exhaust_fan VALUE=0      ; turn exhaust off
    SET_PIN PIN=chamberlight VALUE=0     ; turn chamber light off
    SET_PIN PIN=nevermore VALUE=0        ; turn nevermore off
    
#####################################################################
#   A better print_start macro for v2/trident
#####################################################################

[gcode_macro PRINT_START]
gcode:
  # Fetch parameters from Slicer
  {% set target_bed = params.BED|int %}
  {% set target_extruder = params.EXTRUDER|int %}
  {% set target_chamber = params.CHAMBER|default("40")|int %}
  {% set x_wait = printer.toolhead.axis_maximum.x|float / 2 %}
  {% set y_wait = printer.toolhead.axis_maximum.y|float / 2 %}

  # 1. Reset and Pre-heat
  SET_GCODE_OFFSET Z=0                                 
  M107                                                 # Turn off fans
  BED_MESH_CLEAR                                       
  STATUS_HOMING
  _CG28                                                # Conditional Home
  G90                                                  # Absolute positioning

  # 2. Bring the printer to its print conditions before referencing the gantry.
  SET_DISPLAY_TEXT MSG="Pre-heat - Bed:{target_bed}c | Nozzle:150c"
  STATUS_HEATING
  M104 S150                                            # Heat nozzle to 150 (softens plastic blobs)
  M190 S{target_bed}                                   # Wait for bed

  {% if target_bed > 90 %}
    SET_DISPLAY_TEXT MSG="Soak: {target_chamber}c"
    SET_PIN PIN=nevermore VALUE=1                      # Start Nevermore
    M106 S255                                          # Fan to circulate air
    G1 X{x_wait} Y{y_wait} Z15 F9000                   # Center toolhead
    TEMPERATURE_WAIT SENSOR="temperature_sensor chamber" MINIMUM={target_chamber}
  {% endif %}

  # 3. Level the gantry at print temperature, then establish the Z reference.
  SET_DISPLAY_TEXT MSG="Leveling Gantry"
  STATUS_LEVELING
  QUAD_GANTRY_LEVEL
  G28 Z

  # 4. Mesh & Clean
  SET_DISPLAY_TEXT MSG="Adaptive Mesh"
  STATUS_MESHING
  BED_MESH_CALIBRATE ADAPTIVE=1                        # Adaptive mesh is much faster

  SET_DISPLAY_TEXT MSG="Cleaning Nozzle"
  STATUS_CLEANING
  CLEAN_NOZZLE

  SET_DISPLAY_TEXT MSG="Cartographer Touch"
  # Touch at 150c for accuracy and to prevent bed damage
  CARTOGRAPHER_TOUCH TOLERANCE=0.015 

  # 5. Final Heat & Prime
  SET_DISPLAY_TEXT MSG="Heating Nozzle: {target_extruder}c"
  STATUS_HEATING
  G1 X5 Y20 Z0.4 F10000                                # Move to prime start
  M109 S{target_extruder}                              # Final nozzle temp

  SET_DISPLAY_TEXT MSG="Printing"
  STATUS_PRINTING
  # Robust Prime Line
  G92 E0
  G1 Y150 E15 F1500                                    # First line
  G92 E0
  G1 Z2.0 F3000
##------------------------------------------------------------------------------------------##
################################ END PRINT ###################################################
##------------------------------------------------------------------------------------------##

[gcode_macro PRINT_END]
gcode:
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    {% set z_safe = [th.position.z + 5, th.axis_maximum.z]|min %}
    
    SAVE_GCODE_STATE NAME=STATE_PRINT_END
    M400                           ; Wait for buffer
    G92 E0                         ; Zero extruder
    G1 E-10.0 F1800                ; Long retract to prevent oozing in the bucket
    
    TURN_OFF_HEATERS
    G90                            ; Absolute
    G0 Z{z_safe} F3000             ; Lift Z safely
    G0 X{x_safe} Y{y_safe} F20000  ; Snap strings
    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 5} F3600 ; Park at rear
    
    M107                           ; Turn off fan
    BED_MESH_CLEAR
    UPDATE_DELAYED_GCODE ID=filter_off DURATION=300 ; Turn off Nevermore in 5 mins
    STATUS_READY
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END

[gcode_macro CLEAN_NOZZLE]
variable_start_x: 290
variable_start_y: 300
variable_start_z: 6.0
variable_x_min: 245
variable_x_max: 285
variable_y_min: 300
variable_y_max: 304
variable_z1: 5.3
variable_z2: 5.0
variable_wipe_qty: 2         # Bumped to 2 for better cleaning
variable_wipe_spd: 350
variable_raise_distance: 10
gcode:
  # 1. Safety Home
  _CG28

  # 2. Preparation
  G90                                            # Absolute positioning
  G1 Z{raise_distance} F3000                     # Ensure clearance
  G1 X{start_x} Y{start_y} F9000                 # Rapid to brush area

  # 3. Cleaning Sequence
  # This loops through the depths: start_z, then z1, then z2
  {% for depth in [start_z, z1, z2] %}
    G1 Z{depth} F1500                            # Lower to current depth
    {% for wipes in range(1, (wipe_qty + 1)) %}
      # Diagonal Scrubbing Pattern
      G1 X{x_min} Y{y_min} F{wipe_spd * 60}
      G1 X{x_max} Y{y_max} F{wipe_spd * 60}
      G1 X{x_min} Y{y_max} F{wipe_spd * 60}
      G1 X{x_max} Y{y_min} F{wipe_spd * 60}
    {% endfor %}
  {% endfor %}

  # 4. Exit
  M400                                           # Finish all moves
  G1 Z{raise_distance} F3000                     # Lift clear
  G1 X{start_x} Y{start_y} F9000                 # Return to start position
