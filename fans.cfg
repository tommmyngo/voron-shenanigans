[fan]
pin: EBBCan:PA1
kick_start_time: 0.5

[heater_fan hotend_fan]
pin: EBBCan:PA0
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0

[controller_fan controller_fan]
pin: PF9
max_power: 1.0
fan_speed: .7
kick_start_time: 1.0
heater: heater_bed
idle_timeout: 60

